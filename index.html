<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convocables — Tableau de bord</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface2: #1e2230;
    --border: #2a2f3e;
    --border-light: #353a4d;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.12);
    --accent-glow: rgba(79,142,247,0.25);
    --text: #e8eaf0;
    --text-dim: #8892a4;
    --text-muted: #545c6e;
    --green: #34c77b;
    --amber: #f5a623;
    --red: #f05454;
    --row-hover: rgba(79,142,247,0.06);
    --header-h: 52px;
    --filter-h: 48px;
    --row-h: 40px;
    --col-min: 120px;
    --radius: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .count-pill {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(79,142,247,0.3);
    padding: 2px 10px;
    border-radius: 20px;
    margin-left: 4px;
  }

  .spacer { flex: 1; }

  .global-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 12px;
    height: 34px;
    width: 280px;
    transition: border-color 0.15s;
  }
  .global-search:focus-within { border-color: var(--accent); }
  .global-search svg { color: var(--text-muted); flex-shrink: 0; }
  .global-search input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    width: 100%;
  }
  .global-search input::placeholder { color: var(--text-muted); }

  .btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    height: 34px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-light); color: var(--text); background: var(--border); }
  .btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* ── Main layout ── */
  .main {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  /* ── Table wrapper ── */
  .table-wrapper {
    flex: 1;
    overflow: auto;
    position: relative;
  }

  .table-container {
    min-width: 100%;
    width: 100%;
  }

  /* ── Column headers ── */
  .col-headers {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
    width: 100%;
  }

  .col-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    height: var(--header-h);
    min-width: var(--col-min);
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background 0.12s;
    position: relative;
  }
  .col-header:hover { background: var(--surface2); }
  .col-header.drag-over { background: var(--accent-dim); border-color: var(--accent); }
  .col-header.dragging { opacity: 0.4; }

  .col-header-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .col-header:hover .col-header-label { color: var(--text); }

  .sort-icon {
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.12s;
    color: var(--text-muted);
  }
  .col-header:hover .sort-icon,
  .col-header.sort-asc .sort-icon,
  .col-header.sort-desc .sort-icon { opacity: 1; }
  .col-header.sort-asc .sort-icon,
  .col-header.sort-desc .sort-icon { color: var(--accent); }

  .resize-handle {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    cursor: col-resize;
    z-index: 2;
    background: transparent;
    transition: background 0.15s;
  }
  .resize-handle:hover,
  .resize-handle.resizing { background: var(--accent); }

  .col-header { position: relative; }
    cursor: grab;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.12s;
    flex-shrink: 0;
  }
  .col-header:hover .drag-handle { opacity: 1; }

  /* ── Filter row ── */
  .col-filters {
    display: flex;
    background: var(--surface2);
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: var(--header-h);
    z-index: 4;
  }

  .col-filter {
    padding: 6px 8px;
    min-width: var(--col-min);
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    height: var(--filter-h);
  }

  .col-filter input, .col-filter select {
    width: 100%;
    height: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 0 8px;
    outline: none;
    transition: border-color 0.12s;
  }
  .col-filter input:focus,
  .col-filter select:focus { border-color: var(--accent); }
  .col-filter input::placeholder { color: var(--text-muted); }
  .col-filter select option { background: var(--surface); }

  /* ── Rows ── */
  .rows-container {
    display: flex;
    flex-direction: column;
  }

  .row {
    display: flex;
    border-bottom: 1px solid var(--border);
    transition: background 0.08s;
  }
  .row:hover { background: var(--row-hover); }
  .row.even { background: rgba(255,255,255,0.015); }
  .row.even:hover { background: var(--row-hover); }

  .cell {
    padding: 0 12px;
    height: var(--row-h);
    min-width: var(--col-min);
    flex-shrink: 0;
    border-right: 1px solid transparent;
    display: flex;
    align-items: center;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .badge-oui { background: rgba(52,199,123,0.15); color: var(--green); }
  .badge-non { background: rgba(84,92,110,0.2); color: var(--text-muted); }
  .badge-sis { background: rgba(79,142,247,0.15); color: var(--accent); }
  .badge-sia { background: rgba(245,166,35,0.15); color: var(--amber); }
  .badge-h { background: rgba(79,142,247,0.1); color: #7ab3ff; }
  .badge-f { background: rgba(240,84,84,0.1); color: #f08888; }

  /* ── Status bar ── */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    height: 38px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-value {
    font-family: 'DM Mono', monospace;
    color: var(--text);
    font-size: 12px;
  }

  /* ── Loader ── */
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex: 1;
    color: var(--text-dim);
    font-size: 14px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Column visibility panel ── */
  .col-panel {
    position: fixed;
    top: 56px;
    right: 0;
    width: 260px;
    max-height: calc(100vh - 56px - 38px);
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    z-index: 20;
    display: none;
    flex-direction: column;
  }
  .col-panel.open { display: flex; }
  .col-panel-header {
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .col-toggle-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.1s;
  }
  .col-toggle-item:hover { background: var(--surface2); }
  .toggle {
    width: 28px;
    height: 16px;
    border-radius: 8px;
    background: var(--border);
    position: relative;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
    top: 2px;
    left: 2px;
    transition: transform 0.15s;
  }
  .toggle.on::after { transform: translateX(12px); }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .pg-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 26px;
    border-radius: 5px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .pg-btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .pg-btn.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(79,142,247,0.4); font-weight: 600; }
  .pg-btn:disabled { opacity: 0.3; cursor: default; }
  .pg-btn:disabled:hover { background: transparent; border-color: transparent; color: var(--text-dim); }
  .pg-ellipsis { color: var(--text-muted); font-size: 12px; padding: 0 4px; }
  .pg-info {
    font-size: 11px;
    color: var(--text-muted);
    margin: 0 8px;
    white-space: nowrap;
  }

  /* ── Tooltip ── */
  .has-tooltip { position: relative; cursor: help; }
  .has-tooltip .tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #0f1117;
    border: 1px solid var(--border-light);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-dim);
    white-space: nowrap;
    z-index: 100;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    max-width: 320px;
    white-space: normal;
    width: max-content;
    max-width: 280px;
  }
  .has-tooltip:hover .tooltip { display: block; }

  .badge-p1 { background: rgba(240,84,84,0.18); color: #f05454; border: 1px solid rgba(240,84,84,0.3); }
  .badge-p2 { background: rgba(245,166,35,0.18); color: #f5a623; border: 1px solid rgba(245,166,35,0.3); }
  .badge-p3 { background: rgba(245,214,35,0.18); color: #d4b800; border: 1px solid rgba(245,214,35,0.3); }
  .badge-p4 { background: rgba(79,142,247,0.18); color: #4f8ef7; border: 1px solid rgba(79,142,247,0.3); }
  .badge-p5 { background: rgba(159,122,234,0.18); color: #9f7aea; border: 1px solid rgba(159,122,234,0.3); }
  .badge-p6 { background: rgba(52,199,123,0.18); color: #34c77b; border: 1px solid rgba(52,199,123,0.3); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  .active-filters {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--accent-dim);
    border: 1px solid rgba(79,142,247,0.3);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 8px 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
    cursor: pointer;
  }
  .filter-chip:hover { background: rgba(79,142,247,0.2); }

  .clear-btn {
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .clear-btn:hover { color: var(--red); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="logo">
    <div class="logo-dot"></div>
    Convocables
    <span class="count-pill" id="totalCount">—</span>
  </div>

  <div class="active-filters" id="activeFilters"></div>

  <div class="spacer"></div>

  <div class="global-search">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="7" cy="7" r="5"/><path d="m11 11 3 3"/>
    </svg>
    <input type="text" id="globalSearch" placeholder="Recherche globale…">
  </div>

  <button class="btn" id="colsBtn" onclick="toggleColPanel()">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="1" y="3" width="4" height="10" rx="1"/><rect x="6" y="3" width="4" height="10" rx="1"/><rect x="11" y="3" width="4" height="10" rx="1"/>
    </svg>
    Colonnes
  </button>

  <button class="btn" onclick="resetAll()">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M3 8a5 5 0 1 0 1-3M3 2v4h4"/>
    </svg>
    Réinitialiser
  </button>
</div>

<!-- Column visibility panel -->
<div class="col-panel" id="colPanel">
  <div class="col-panel-header">
    Colonnes visibles
    <span style="cursor:pointer;color:var(--text-muted)" onclick="toggleColPanel()">✕</span>
  </div>
  <div id="colToggles"></div>
</div>

<!-- Main -->
<div class="main" id="main">
  <div class="loader" id="loader">
    <div class="spinner"></div>
    Chargement des données…
  </div>

  <div class="table-wrapper" id="tableWrapper" style="display:none">
    <div class="table-container" id="tableContainer">
      <!-- col headers -->
      <div class="col-headers" id="colHeaders"></div>
      <!-- filter row -->
      <div class="col-filters" id="colFilters"></div>
      <!-- rows -->
      <div class="rows-container" id="rowsContainer">
        <div id="visibleRows"></div>
      </div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="statusbar">
  <div class="status-item">
    <span class="status-value" id="statusFiltered">—</span>
    résultats sur
    <span class="status-value" id="statusTotal">—</span>
  </div>
  <div class="status-item" id="statusSort"></div>
  <div class="spacer"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
// ══════════════════════════════════════════════
// Config
// ══════════════════════════════════════════════
const PAGE_SIZE = 20;

// ══════════════════════════════════════════════
// Config
// ══════════════════════════════════════════════
const COL_LABELS = {
  ordre: 'ORDRE',
  priorite: 'PRIORITÉ',
  matricule_pa: 'Matricule',
  nom_naissance_pa: 'NOM',
  nom_usage_pa: 'Nom usage',
  prenom_pa: 'Prénom',
  sexe_pa: 'Sexe',
  dt_naissance_pa: 'Date naissance',
  age_calc: 'Âge',
  mi_carriere_calc: 'Mi-carrière',
  est_apprenti_cn: 'Apprenti',
  est_stagiaire_cn: 'Stagiaire',
  est_saisonnier_cn: 'Saisonnier',
  est_enceinte_calc: 'Enceinte',
  est_pension_invalidite_calc: 'Pension inv.',
  est_mineur_calc: 'Mineur',
  est_travailleur_handicape_calc: 'Trav. hand.',
  suivi_calc: 'Suivi',
  ancien_suivi_calc: 'Anc. suivi',
  demandeur_calc: 'Demandeur',
  code_ad: 'Code adhérent',
  nom_ad: 'ADHÉRENT',
  dt_entree_sa: 'ENTRÉE',
  date_declaration: 'Date décl.',
  dt_pro_visite_sa: 'Proch. visite',
  lib_pro_visite: 'Type visite',
  periodicite_pro_visite_calc: 'Périodicité',
};

const BOOL_COLS = new Set(['mi_carriere_calc','est_apprenti_cn','est_stagiaire_cn','est_saisonnier_cn','est_enceinte_calc','est_pension_invalidite_calc','est_mineur_calc','est_travailleur_handicape_calc']);
const DATE_COLS = new Set(['dt_naissance_pa','dt_entree_sa','date_declaration','dt_pro_visite_sa']);
const COL_WIDTHS = {
  ordre: 70,
  priorite: 90,
  matricule_pa: 100, nom_naissance_pa: 130, nom_usage_pa: 120, prenom_pa: 110,
  sexe_pa: 80, dt_naissance_pa: 120, age_calc: 70, mi_carriere_calc: 90,
  est_apprenti_cn: 85, est_stagiaire_cn: 85, est_saisonnier_cn: 90,
  est_enceinte_calc: 85, est_pension_invalidite_calc: 100, est_mineur_calc: 75,
  est_travailleur_handicape_calc: 110, suivi_calc: 75, ancien_suivi_calc: 95,
  demandeur_calc: 100, code_ad: 105, nom_ad: 220, dt_entree_sa: 110,
  date_declaration: 105, dt_pro_visite_sa: 115, lib_pro_visite: 260,
  periodicite_pro_visite_calc: 100,
};

// ══════════════════════════════════════════════
// State
// ══════════════════════════════════════════════
let allRows = [];
let filteredRows = [];
let columns = [];
let visibleCols = {};
let colFilters = {};
let globalFilter = '';
let sortCol = null;
let sortDir = 1;
let dragSrc = null;
let currentPage = 1;

// ══════════════════════════════════════════════
// Load CSV
// ══════════════════════════════════════════════
const DATA_URL = 'data.csv';

Papa.parse(DATA_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete(res) {
    allRows = res.data;
    columns = res.meta.fields;
    const DEFAULT_COLS = new Set(['ordre','priorite','nom_naissance_pa','prenom_pa','nom_ad','age_calc','dt_entree_sa','dt_pro_visite_sa','lib_pro_visite','suivi_calc']);

    // Compute priority and sort date for each row
    allRows.forEach(r => {
      r['priorite'] = computePriority(r);
      r['_sortDate'] = getSortDate(r);
    });

    columns = [...res.meta.fields, 'priorite', 'ordre'];
    visibleCols = Object.fromEntries(columns.map(c => [c, DEFAULT_COLS.has(c)]));
    colFilters = Object.fromEntries(columns.map(c => [c, '']));

    document.getElementById('loader').style.display = 'none';
    document.getElementById('tableWrapper').style.display = '';
    document.getElementById('totalCount').textContent = allRows.length.toLocaleString('fr-FR');

    buildColPanel();
    buildHeaders();
    buildFilterRow();
    applyFilters();
  },
  error(e) {
    document.getElementById('loader').innerHTML = `<span style="color:var(--red)">Erreur de chargement : ${e}</span>`;
  }
});

// ══════════════════════════════════════════════
// Build UI
// ══════════════════════════════════════════════
function getColStyle(col, cols) {
  const w = COL_WIDTHS[col] || 140;
  const isLast = cols[cols.length - 1] === col;
  return isLast
    ? `min-width:${w}px;flex:1;`
    : `min-width:${w}px;width:${w}px;flex-shrink:0;`;
}

function visibleColumns() {
  return columns.filter(c => visibleCols[c]);
}

function buildHeaders() {
  const container = document.getElementById('colHeaders');
  container.innerHTML = '';
  for (const col of visibleColumns()) {
    const cols = visibleColumns();
    const style = getColStyle(col, cols);
    const div = document.createElement('div');
    div.className = 'col-header' + (sortCol === col ? (sortDir > 0 ? ' sort-asc' : ' sort-desc') : '');
    div.style.cssText = style;
    div.dataset.col = col;
    div.draggable = true;

    div.innerHTML = `
      <svg class="drag-handle" width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
        <circle cx="4" cy="3" r="1.2"/><circle cx="8" cy="3" r="1.2"/>
        <circle cx="4" cy="6" r="1.2"/><circle cx="8" cy="6" r="1.2"/>
        <circle cx="4" cy="9" r="1.2"/><circle cx="8" cy="9" r="1.2"/>
      </svg>
      <span class="col-header-label" title="${col}">${COL_LABELS[col] || col}</span>
      <svg class="sort-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8">
        ${sortCol === col && sortDir > 0
          ? '<path d="M6 9V3M3 6l3-3 3 3"/>'
          : sortCol === col && sortDir < 0
          ? '<path d="M6 3v6M3 6l3 3 3-3"/>'
          : '<path d="M6 3v6M4 5l2-2 2 2M4 7l2 2 2-2"/>'}
      </svg>
      <div class="resize-handle" data-col="${col}"></div>`;

    div.addEventListener('click', e => { if (!e.target.closest('.drag-handle') && !e.target.closest('.resize-handle')) toggleSort(col); });
    div.addEventListener('dragstart', e => { if (e.target.closest('.resize-handle')) { e.preventDefault(); return; } dragSrc = col; div.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    div.addEventListener('dragend', () => { div.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); });
    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => { e.preventDefault(); if (dragSrc && dragSrc !== col) reorderCol(dragSrc, col); });

    // Resize
    const handle = div.querySelector('.resize-handle');
    handle.addEventListener('mousedown', e => startResize(e, col, div));

    container.appendChild(div);
  }
}

function buildFilterRow() {
  const container = document.getElementById('colFilters');
  container.innerHTML = '';
  for (const col of visibleColumns()) {
    const cols = visibleColumns();
    const style = getColStyle(col, cols);
    const div = document.createElement('div');
    div.className = 'col-filter';
    div.style.cssText = style;

    if (col === 'priorite') {
      const sel = document.createElement('select');
      sel.innerHTML = `<option value="">Tous</option><option>Niv 1</option><option>Niv 2</option><option>Niv 3</option><option>Niv 4</option><option>Niv 5</option><option>Niv 6</option>`;
      sel.value = colFilters[col] || '';
      sel.addEventListener('change', () => { colFilters[col] = sel.value; applyFilters(); });
      div.appendChild(sel);
    } else if (BOOL_COLS.has(col)) {
      const sel = document.createElement('select');
      sel.innerHTML = `<option value="">Tous</option><option value="Oui">Oui</option><option value="Non">Non</option>`;
      sel.value = colFilters[col] || '';
      sel.addEventListener('change', () => { colFilters[col] = sel.value; applyFilters(); });
      div.appendChild(sel);
    } else if (col === 'sexe_pa') {
      const sel = document.createElement('select');
      sel.innerHTML = `<option value="">Tous</option><option value="Homme">Homme</option><option value="Femme">Femme</option>`;
      sel.value = colFilters[col] || '';
      sel.addEventListener('change', () => { colFilters[col] = sel.value; applyFilters(); });
      div.appendChild(sel);
    } else if (col === 'suivi_calc' || col === 'ancien_suivi_calc') {
      const sel = document.createElement('select');
      sel.innerHTML = `<option value="">Tous</option><option value="SIS">SIS</option><option value="SIA">SIA</option>`;
      sel.value = colFilters[col] || '';
      sel.addEventListener('change', () => { colFilters[col] = sel.value; applyFilters(); });
      div.appendChild(sel);
    } else {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = '…';
      inp.value = colFilters[col] || '';
      inp.addEventListener('input', () => { colFilters[col] = inp.value; applyFiltersDebounced(); });
      div.appendChild(inp);
    }

    container.appendChild(div);
  }
}

function buildColPanel() {
  const container = document.getElementById('colToggles');
  container.innerHTML = '';
  for (const col of columns) {
    const div = document.createElement('div');
    div.className = 'col-toggle-item';
    div.innerHTML = `
      <div class="toggle ${visibleCols[col] ? 'on' : ''}" id="toggle-${col}"></div>
      <span>${COL_LABELS[col] || col}</span>`;
    div.addEventListener('click', () => toggleColVisibility(col));
    container.appendChild(div);
  }
}

function toggleColPanel() {
  const panel = document.getElementById('colPanel');
  const btn = document.getElementById('colsBtn');
  panel.classList.toggle('open');
  btn.classList.toggle('active');
}

function toggleColVisibility(col) {
  visibleCols[col] = !visibleCols[col];
  const tog = document.getElementById(`toggle-${col}`);
  if (tog) tog.classList.toggle('on', visibleCols[col]);
  buildHeaders();
  buildFilterRow();
  renderPage();
}

// ══════════════════════════════════════════════
// Filter & sort
// ══════════════════════════════════════════════
let filterTimer = null;
function applyFiltersDebounced() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(applyFilters, 200);
}

function applyFilters() {
  const g = globalFilter.toLowerCase().trim();
  const activeCols = Object.entries(colFilters).filter(([,v]) => v).map(([k,v]) => [k, v.toLowerCase()]);

  filteredRows = allRows.filter(row => {
    for (const [col, val] of activeCols) {
      const cell = String(row[col] || '').toLowerCase();
      if (!cell.includes(val)) return false;
    }
    if (g) {
      const found = Object.values(row).some(v => String(v || '').toLowerCase().includes(g));
      if (!found) return false;
    }
    return true;
  });

  const NIV_ORDER = {'Niv 1':1,'Niv 2':2,'Niv 3':3,'Niv 4':4,'Niv 5':5,'Niv 6':6,'—':7};

  if (sortCol) {
    const NIV_ORDER = {'Niv 1':1,'Niv 2':2,'Niv 3':3,'Niv 4':4,'Niv 5':5,'Niv 6':6,'—':7};
    filteredRows.sort((a, b) => {
      if (sortCol === 'priorite') {
        const na = NIV_ORDER[a['priorite']] || 7;
        const nb = NIV_ORDER[b['priorite']] || 7;
        return (na - nb) * sortDir;
      }
      const av = a[sortCol] || '';
      const bv = b[sortCol] || '';
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  } else {
    // Default: sort by priority level, then by relevant date ascending
    filteredRows.sort((a, b) => {
      const na = NIV_ORDER[a['priorite']] || 7;
      const nb = NIV_ORDER[b['priorite']] || 7;
      if (na !== nb) return na - nb;
      const da = a['_sortDate'];
      const db = b['_sortDate'];
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    });
  }

  currentPage = 1;
  document.getElementById('tableWrapper').scrollTop = 0;

  // Assign order rank after sort
  filteredRows.forEach((r, i) => { r['ordre'] = i + 1; });

  document.getElementById('statusFiltered').textContent = filteredRows.length.toLocaleString('fr-FR');
  document.getElementById('statusTotal').textContent = allRows.length.toLocaleString('fr-FR');

  updateActiveFilters();
  renderPage();
}

function toggleSort(col) {
  if (sortCol === col) {
    sortDir = sortDir > 0 ? -1 : 1;
  } else {
    sortCol = col;
    sortDir = 1;
  }
  document.getElementById('statusSort').textContent = `Trié par ${COL_LABELS[sortCol] || sortCol} ${sortDir > 0 ? '↑' : '↓'}`;
  buildHeaders();
  applyFilters();
}

function reorderCol(src, dest) {
  const si = columns.indexOf(src);
  const di = columns.indexOf(dest);
  columns.splice(si, 1);
  columns.splice(di, 0, src);
  buildHeaders();
  buildFilterRow();
  renderPage();
}

function updateActiveFilters() {
  const container = document.getElementById('activeFilters');
  const active = Object.entries(colFilters).filter(([,v]) => v);
  if (globalFilter) active.push(['__global__', globalFilter]);

  if (!active.length) { container.innerHTML = ''; return; }

  container.innerHTML = active.slice(0, 5).map(([col, val]) => `
    <div class="filter-chip" onclick="clearFilter('${col}')">
      ${col === '__global__' ? '🔍' : (COL_LABELS[col] || col)}: <strong>${escHtml(val)}</strong> ✕
    </div>
  `).join('') + `<span class="clear-btn" onclick="resetFilters()">Tout effacer</span>`;
}

function clearFilter(col) {
  if (col === '__global__') {
    globalFilter = '';
    document.getElementById('globalSearch').value = '';
  } else {
    colFilters[col] = '';
    buildFilterRow();
  }
  applyFilters();
}

function resetFilters() {
  colFilters = Object.fromEntries(columns.map(c => [c, '']));
  globalFilter = '';
  document.getElementById('globalSearch').value = '';
  buildFilterRow();
  applyFilters();
}

function resetAll() {
  columns = [...Object.keys(COL_LABELS).filter(c => c !== 'priorite' && c !== 'ordre' && allRows[0] && c in allRows[0]), 'priorite', 'ordre'];
  const DEFAULT_COLS = new Set(['ordre','priorite','nom_naissance_pa','prenom_pa','nom_ad','age_calc','dt_entree_sa','dt_pro_visite_sa','lib_pro_visite','suivi_calc']);
  visibleCols = Object.fromEntries(columns.map(c => [c, DEFAULT_COLS.has(c)]));
  colFilters = Object.fromEntries(columns.map(c => [c, '']));
  globalFilter = '';
  sortCol = null;
  sortDir = 1;
  document.getElementById('globalSearch').value = '';
  document.getElementById('statusSort').textContent = '';
  buildHeaders();
  buildFilterRow();
  buildColPanel();
  applyFilters();
}

// ══════════════════════════════════════════════
// Pagination
// ══════════════════════════════════════════════
function totalPages() {
  return Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
}

function goToPage(p) {
  currentPage = Math.max(1, Math.min(p, totalPages()));
  document.getElementById('tableWrapper').scrollTop = 0;
  renderPage();
}

function renderPage() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filteredRows.slice(start, start + PAGE_SIZE);
  const cols = visibleColumns();

  const fragment = document.createDocumentFragment();
  pageRows.forEach((row, i) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row' + (i % 2 !== 0 ? ' even' : '');
    for (const col of cols) {
      const style = getColStyle(col, cols);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.cssText = style;
      const val = row[col] || '';
      cell.innerHTML = formatCell(col, val);
      cell.title = val;
      rowEl.appendChild(cell);
    }
    fragment.appendChild(rowEl);
  });

  const container = document.getElementById('visibleRows');
  container.innerHTML = '';
  container.appendChild(fragment);

  renderPagination();
}

function renderPagination() {
  const total = totalPages();
  const cur = currentPage;
  const container = document.getElementById('pagination');

  if (total <= 1) { container.innerHTML = ''; return; }

  let html = '';

  // Info
  const from = ((cur - 1) * PAGE_SIZE + 1).toLocaleString('fr-FR');
  const to = Math.min(cur * PAGE_SIZE, filteredRows.length).toLocaleString('fr-FR');
  html += `<span class="pg-info">${from}–${to}</span>`;

  // Prev
  html += `<button class="pg-btn" onclick="goToPage(${cur - 1})" ${cur === 1 ? 'disabled' : ''}>‹</button>`;

  // Page numbers with ellipsis
  const pages = getPageNumbers(cur, total);
  let lastPg = null;
  for (const pg of pages) {
    if (pg === '…') {
      html += `<span class="pg-ellipsis">…</span>`;
    } else {
      html += `<button class="pg-btn ${pg === cur ? 'active' : ''}" onclick="goToPage(${pg})">${pg}</button>`;
    }
    lastPg = pg;
  }

  // Next
  html += `<button class="pg-btn" onclick="goToPage(${cur + 1})" ${cur === total ? 'disabled' : ''}>›</button>`;

  container.innerHTML = html;
}

function getPageNumbers(cur, total) {
  // Show: 1 … cur-1 cur cur+1 … total
  const pages = [];
  const delta = 1; // pages around current

  const range = new Set();
  range.add(1);
  range.add(total);
  for (let i = cur - delta; i <= cur + delta; i++) {
    if (i >= 1 && i <= total) range.add(i);
  }

  const sorted = [...range].sort((a, b) => a - b);
  let prev = null;
  for (const p of sorted) {
    if (prev !== null && p - prev > 1) pages.push('…');
    pages.push(p);
    prev = p;
  }
  return pages;
}

function formatCell(col, val) {
  if (!val || val === '') return `<span style="color:var(--text-muted)">—</span>`;

  if (col === 'ordre') {
    return `<span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted)">${val}</span>`;
  }

  if (col === 'priorite') {
    const map = { 'Niv 1': 'p1', 'Niv 2': 'p2', 'Niv 3': 'p3', 'Niv 4': 'p4', 'Niv 5': 'p5', 'Niv 6': 'p6' };
    const cls = map[val];
    const tooltips = {
      'Niv 1': 'Date d\'entrée future ou absente · Suivi SIA · Visite SIR · Demande du médecin du travail',
      'Niv 2': 'Entrée récente (≤ 30 j) · Femme enceinte · Pension invalidité · Trav. handicapé · Ancien SIS passé en SIA',
      'Niv 3': 'Apprenti(e) majeur(e) (≥ 18 ans)',
      'Niv 4': 'Suivi SIS avec prochaine visite dans les 3 mois',
      'Niv 5': 'Visite de mi-carrière',
      'Niv 6': 'Visite périodique dans les 3 mois',
    };
    return cls
      ? `<span class="has-tooltip"><span class="badge badge-${cls}" style="font-family:'DM Mono',monospace;font-size:11px;font-weight:600">${val}</span><div class="tooltip">${tooltips[val] || ''}</div></span>`
      : `<span style="color:var(--text-muted)">—</span>`;
  }
  if (BOOL_COLS.has(col)) {
    const isOui = val === true || val === 'true' || val === 'Oui';
    return isOui
      ? `<span class="badge badge-oui">Oui</span>`
      : `<span class="badge badge-non">Non</span>`;
  }
  if (col === 'sexe_pa') {
    return val === 'Homme'
      ? `<span class="badge badge-h">♂ Homme</span>`
      : `<span class="badge badge-f">♀ Femme</span>`;
  }
  if (col === 'suivi_calc' || col === 'ancien_suivi_calc') {
    return val === 'SIS'
      ? `<span class="badge badge-sis">SIS</span>`
      : `<span class="badge badge-sia">SIA</span>`;
  }
  if (col === 'age_calc') {
    const age = val.toString().replace(/\.0$/, '');
    return `<span style="font-family:'DM Mono',monospace;font-size:12px">${age}</span>`;
  }
  if (DATE_COLS.has(col)) {
    return `<span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text-dim)">${val}</span>`;
  }
  if (col === 'matricule_pa' || col === 'code_ad') {
    return `<span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--accent)">${val}</span>`;
  }
  return `<span style="max-width:100%;overflow:hidden;text-overflow:ellipsis">${escHtml(val)}</span>`;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getSortDate(row) {
  function parseDate(str) {
    if (!str || str.trim() === '') return null;
    const parts = str.split('/');
    if (parts.length !== 3) return null;
    const [d, m, y] = parts;
    const dt = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    return isNaN(dt.getTime()) ? null : dt;
  }
  const entree = parseDate(row['dt_entree_sa']);
  const visite = parseDate(row['dt_pro_visite_sa']);
  const niv = row['priorite'];
  // Niv 1 avec entrée future/absente → trier par date d'entrée
  if (niv === 'Niv 1' && (!entree || entree > new Date())) return entree;
  // Autres cas → trier par prochaine visite
  return visite;
}


// ══════════════════════════════════════════════
function computePriority(row) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  function parseDate(str) {
    if (!str || str.trim() === '') return null;
    const parts = str.split('/');
    if (parts.length !== 3) return null;
    const [d, m, y] = parts;
    const dt = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    return isNaN(dt.getTime()) ? null : dt;
  }

  function isTrue(val) { return val === true || val === 'true' || val === 'Oui'; }

  const entree         = parseDate(row['dt_entree_sa']);
  const prochaineVisite = parseDate(row['dt_pro_visite_sa']);
  const suivi          = (row['suivi_calc'] || '').trim();
  const ancienSuivi    = (row['ancien_suivi_calc'] || '').trim();
  const libVisite      = (row['lib_pro_visite'] || '').toLowerCase();
  const age            = parseFloat(row['age_calc']) || 0;

  // ── Niv 1 ──────────────────────────────────
  // Date d'entrée future ou absente
  if (!entree || entree > today) return 'Niv 1';
  // Suivi SIA
  if (suivi === 'SIA') return 'Niv 1';
  // Suivi SIR (présent dans lib_pro_visite)
  if (libVisite.includes('sir')) return 'Niv 1';
  // Visite à la demande du médecin du travail
  if (libVisite.includes('demande') && (libVisite.includes('médecin') || libVisite.includes('medecin'))) return 'Niv 1';

  // ── Niv 2 ──────────────────────────────────
  // Date d'entrée antérieure mais proche (≤ 30 jours)
  const daysSince = (today - entree) / 86400000;
  if (daysSince <= 30) return 'Niv 2';
  // Femme enceinte, pension invalidité, travailleur handicapé
  if (isTrue(row['est_enceinte_calc'])) return 'Niv 2';
  if (isTrue(row['est_pension_invalidite_calc'])) return 'Niv 2';
  if (isTrue(row['est_travailleur_handicape_calc'])) return 'Niv 2';
  // Ancien suivi SIS passé en SIA
  if (ancienSuivi === 'SIS' && suivi === 'SIA') return 'Niv 2';

  // ── Niv 3 ──────────────────────────────────
  // Apprentis majeurs (≥ 18 ans)
  if (isTrue(row['est_apprenti_cn']) && age >= 18) return 'Niv 3';

  // ── Niv 4 ──────────────────────────────────
  // SIS dont la prochaine visite est dans les 3 mois
  if (suivi === 'SIS' && prochaineVisite) {
    const daysUntil = (prochaineVisite - today) / 86400000;
    if (daysUntil >= 0 && daysUntil <= 90) return 'Niv 4';
  }

  // ── Niv 5 ──────────────────────────────────
  // Mi-carrière
  if (isTrue(row['mi_carriere_calc'])) return 'Niv 5';

  // ── Niv 6 ──────────────────────────────────
  // Visite périodique dans les 3 mois
  if (prochaineVisite) {
    const daysUntil = (prochaineVisite - today) / 86400000;
    if (daysUntil >= 0 && daysUntil <= 90) return 'Niv 6';
  }

  return '—';
}

// ══════════════════════════════════════════════
// Column resize
// ══════════════════════════════════════════════
function startResize(e, col, headerEl) {
  e.preventDefault();
  e.stopPropagation();
  const handle = headerEl.querySelector('.resize-handle');
  handle.classList.add('resizing');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';

  const startX = e.clientX;
  const startW = COL_WIDTHS[col] || 140;

  function onMove(ev) {
    const newW = Math.max(60, startW + ev.clientX - startX);
    COL_WIDTHS[col] = newW;
    renderPage();
    buildHeaders();
    buildFilterRow();
  }

  function onUp() {
    handle.classList.remove('resizing');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    renderPage();
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// ══════════════════════════════════════════════
// Global search
// ══════════════════════════════════════════════
document.getElementById('globalSearch').addEventListener('input', e => {
  globalFilter = e.target.value;
  applyFiltersDebounced();
});

// ══════════════════════════════════════════════
// Close col panel on outside click
// ══════════════════════════════════════════════
document.addEventListener('click', e => {
  if (!e.target.closest('#colPanel') && !e.target.closest('#colsBtn')) {
    document.getElementById('colPanel').classList.remove('open');
    document.getElementById('colsBtn').classList.remove('active');
  }
});
